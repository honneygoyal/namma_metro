<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetroMate Bengaluru</title>
    <style>
      :root {
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #ecfeff, #fff7ed);
        margin: 0;
      }

      main {
        display: grid;
        gap: 20px;
        margin: 0 auto;
        max-width: 920px;
        min-height: 100vh;
        padding: 48px 20px;
        place-content: center;
      }

      h1 {
        font-size: clamp(40px, 8vw, 72px);
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
      }

      p {
        color: #475569;
        font-size: 20px;
        line-height: 1.5;
        margin: 0;
        max-width: 720px;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        background: #111827;
        border-radius: 8px;
        color: white;
        font-weight: 800;
        padding: 12px 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MetroMate Bengaluru</h1>
      <p>
        A free offline-first Bengaluru metro route planner with station search, route guidance, interactive map, journey mode, and optional nearest-station lookup.
      </p>
      <nav>
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/support.html">Support</a>
      </nav>
    </main>
  </body>
</html>
