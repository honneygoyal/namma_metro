<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetroMate Bengaluru</title>
    <style>
      :root {
        color: #f8fafc;
        background: #07111f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        max-width: 520px;
      }

      p {
        color: #a7f3d0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <p>MetroMate Bengaluru</p>
      <h1>The app could not load its offline bundle.</h1>
      <p>Please reinstall the latest build or clear the app storage, then open MetroMate again.</p>
    </main>
  </body>
</html>
